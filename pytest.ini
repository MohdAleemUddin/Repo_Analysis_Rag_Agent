[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*

# Confluence PRD compliance discovery
# tests/confluence/test_*.py included via testpaths

# Markers for PRD compliance (US-15)
markers =
    prd_compliance: PRD requirement compliance (UR, FR, NFR).
    api_format: API response format per PRD §9.1.
    performance: Performance targets (NFR1); use --timeout=120 when using pytest-timeout.
    integration: Integration and backward-compatibility.
