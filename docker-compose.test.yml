services:
  postgres-ide:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: zeroui_ide_user
      POSTGRES_PASSWORD: change_me_ide
      POSTGRES_DB: zeroui_ide_pg
    ports:
      - "5436:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zeroui_ide_user"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
